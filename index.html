<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transporte FES Cuautitlán</title>
<meta name="description" content="Horarios del transporte de la FES Cuautitlán, UNAM: Campo Uno, Campo Cuatro e Intercampus.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5cad" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Transporte FESC">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-zinc-100 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
<main class="mx-auto max-w-2xl px-4 pb-[max(2rem,env(safe-area-inset-bottom))] pt-[max(1rem,env(safe-area-inset-top))]">
  <header class="mb-5 flex flex-wrap items-baseline justify-between gap-x-3">
    <h1 class="text-2xl font-extrabold tracking-tight">Transporte FES Cuautitlán</h1>
    <p id="clock" class="text-sm font-medium tabular-nums text-zinc-500 dark:text-zinc-400"></p>
  </header>

  <nav id="campus" class="mb-3 flex gap-2" aria-label="Campus"></nav>
  <nav id="routes" class="-mx-4 mb-4 flex gap-2 overflow-x-auto px-4 pb-1" aria-label="Rutas"></nav>
  <section id="info" class="mb-4 px-1"></section>
  <nav id="days" class="mb-4 flex gap-2" aria-label="Tipo de día"></nav>
  <div id="dirs" class="space-y-4"></div>

  <footer class="mt-8 px-1 text-xs leading-relaxed text-zinc-500 dark:text-zinc-400">
    Fuente: horarios de la Secretaría de Atención a la Comunidad, FES Cuautitlán, UNAM. Fecha de modificación: 12 de octubre de 2026.Si no presentas tu identificación UNAM, se te puede negar el acceso al transporte.
  </footer>
</main>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("SW no registrado:", e); });
  });
}
</script>
</body>
</html>
